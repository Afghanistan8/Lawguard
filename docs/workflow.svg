<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Lawguard verification workflow">
  <defs>
    <style>
      .lbl { font-family:Segoe UI, Arial, sans-serif; font-size:14px; fill:#16202e; }
      .sub { font-family:Segoe UI, Arial, sans-serif; font-size:11.5px; fill:#5b6675; }
      .n { font-family:Segoe UI, Arial, sans-serif; font-size:13px; font-weight:700; fill:#ffffff; }
      .flow { stroke:#1f3a5f; stroke-width:2.5; fill:none; marker-end:url(#a2); }
      .fail { stroke:#a12a2a; stroke-width:2.5; fill:none; marker-end:url(#a3); stroke-dasharray:6 4; }
    </style>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f3a5f"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a12a2a"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="40" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f3a5f">Verification workflow (per write tool)</text>

  <!-- Steps -->
  <g>
    <circle cx="70" cy="110" r="18" fill="#1f3a5f"/><text x="64" y="115" class="n">1</text>
    <rect x="100" y="86" width="200" height="48" rx="8" fill="#f5f6f8" stroke="#c2cad6"/>
    <text x="116" y="108" class="lbl">Lawyer submits query</text>
    <text x="116" y="126" class="sub">crime / statute / facts + jurisdiction</text>

    <circle cx="70" cy="200" r="18" fill="#1f3a5f"/><text x="64" y="205" class="n">2</text>
    <rect x="100" y="176" width="200" height="48" rx="8" fill="#f5f6f8" stroke="#c2cad6"/>
    <text x="116" y="198" class="lbl">Validate &amp; sanitise</text>
    <text x="116" y="216" class="sub">length, HTTPS-only, allowed chars</text>

    <circle cx="70" cy="290" r="18" fill="#1f3a5f"/><text x="64" y="295" class="n">3</text>
    <rect x="100" y="266" width="200" height="48" rx="8" fill="#f5f6f8" stroke="#c2cad6"/>
    <text x="116" y="288" class="lbl">Resolve trusted sources</text>
    <text x="116" y="306" class="sub">country-aware official registry</text>
  </g>

  <path class="flow" d="M200,134 L200,176"/>
  <path class="flow" d="M200,224 L200,266"/>
  <path class="flow" d="M300,290 L360,290"/>

  <!-- Consensus block -->
  <rect x="360" y="90" width="300" height="220" rx="12" fill="#eef3f8" stroke="#1f3a5f" stroke-width="2"/>
  <text x="378" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f3a5f">Leader + Validators (Equivalence Principle)</text>

  <rect x="384" y="132" width="252" height="42" rx="8" fill="#ffffff" stroke="#c2cad6"/>
  <text x="398" y="150" class="lbl">Fetch sources (HTTPS)</text>
  <text x="398" y="167" class="sub">wrapped in UNTRUSTED DATA markers</text>

  <rect x="384" y="182" width="252" height="42" rx="8" fill="#ffffff" stroke="#c2cad6"/>
  <text x="398" y="200" class="lbl">Grounded LLM analysis</text>
  <text x="398" y="217" class="sub">no invented statutes / case law</text>

  <rect x="384" y="232" width="252" height="42" rx="8" fill="#ffffff" stroke="#c2cad6"/>
  <text x="398" y="250" class="lbl">Normalise decision fields</text>
  <text x="398" y="267" class="sub">status · citation · bucket · confidence</text>

  <rect x="384" y="282" width="252" height="20" rx="6" fill="#e4f3ec" stroke="#1c7c54"/>
  <text x="398" y="297" class="sub">Validators must agree on decision key</text>

  <path class="flow" d="M660,200 L720,200"/>

  <!-- Commit -->
  <circle cx="750" cy="200" r="18" fill="#1c7c54"/><text x="744" y="205" class="n">4</text>
  <rect x="780" y="150" width="190" height="48" rx="8" fill="#e4f3ec" stroke="#1c7c54"/>
  <text x="796" y="172" class="lbl">Commit on-chain</text>
  <text x="796" y="190" class="sub">stored + stats + audit trail</text>

  <rect x="780" y="212" width="190" height="48" rx="8" fill="#fbf1da" stroke="#9a6a00"/>
  <text x="796" y="234" class="lbl">Auto-alert if flagged</text>
  <text x="796" y="252" class="sub">low conf · conflict · no source</text>

  <!-- Fail-safe path -->
  <path class="fail" d="M510,310 C510,370 510,390 510,400"/>
  <rect x="360" y="400" width="300" height="46" rx="8" fill="#fbe6e6" stroke="#a12a2a"/>
  <text x="376" y="422" class="lbl">Sources unreachable / no consensus?</text>
  <text x="376" y="440" class="sub">→ return UNAVAILABLE / INSUFFICIENT_EVIDENCE (never hallucinate)</text>
</svg>
