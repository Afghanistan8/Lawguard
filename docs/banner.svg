<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Lawguard banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16283f"/>
      <stop offset="1" stop-color="#1f3a5f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d3ab5e"/>
      <stop offset="1" stop-color="#b48a3c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect y="294" width="1200" height="6" fill="url(#gold)"/>

  <!-- Shield + scales emblem -->
  <g transform="translate(90,60) scale(1.5)">
    <path d="M60 5l40 15v25c0 25-17 46-40 55C37 91 20 70 20 45V20L60 5z" fill="#b48a3c" opacity="0.16"/>
    <path d="M60 5l40 15v25c0 25-17 46-40 55C37 91 20 70 20 45V20L60 5z" fill="none" stroke="#d3ab5e" stroke-width="2.5"/>
    <path d="M60 22v46M40 34h40M45 34l-8 15a4 4 0 008 0l-8-15zM75 34l-8 15a4 4 0 008 0l-8-15z"
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="330" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff">Lawguard</text>
  <text x="332" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#d3ab5e">On-chain, source-grounded law verification support</text>
  <text x="332" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#c9d4e3">Powered by GenLayer Intelligent Contracts · Leader/Validator consensus · Fully auditable</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#16283f">
    <rect x="332" y="234" width="150" height="30" rx="15" fill="#d3ab5e"/>
    <text x="352" y="254">Decision-support only</text>
    <rect x="494" y="234" width="140" height="30" rx="15" fill="#e4eef6"/>
    <text x="514" y="254">Never legal advice</text>
    <rect x="646" y="234" width="170" height="30" rx="15" fill="#e4f3ec"/>
    <text x="666" y="254">Grounded in primary law</text>
  </g>
</svg>
