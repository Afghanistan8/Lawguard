# gltest configuration.
#
# The offline unit suite in tests/ does NOT need this file — it runs under plain
# pytest via the GenVM test double in tests/conftest.py. This file only scopes
# `paths`/`environment` and selects a default network for optional on-chain
# integration runs with `genlayer-test`.
#
# Valid top-level keys: networks, paths, environment. Lawguard targets GenLayer
# StudioNet only. StudioNet is built in to gltest and is selected via the CLI
# (`genlayer network set studionet`) with an unlocked account — so it is NOT
# redefined here (redefining a network requires committing account keys, which
# must never live in the repo).
paths:
  contracts: contracts
  artifacts: artifacts

environment: .env
